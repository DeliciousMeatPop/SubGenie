name: Build & draft release

# Cut a release by pushing a version tag:
#     git tag v0.2.0 && git push origin v0.2.0
# ...or run this workflow manually from the Actions tab and type a version in.
#
# It builds a standalone SubtitleGenie executable for Windows, macOS and Linux,
# then opens a DRAFT GitHub release with those archives attached and the notes
# pre-filled from CHANGELOG.md via .github/RELEASE_TEMPLATE.md. Nothing is ever
# published automatically - you review the draft and hit publish.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. v0.2.0)"
        required: true
      bundle_ffsubsync:
        description: "Bundle ffsubsync for higher-quality --sync (experimental, bigger exe)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Resolve the tag/version once so build and release agree on names.
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      exists: ${{ steps.exists.outputs.exists }}
    steps:
      - id: v
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.version }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          case "$TAG" in v*) ;; *) TAG="v$TAG";; esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # If a release for this tag already exists, we must NOT touch it - a
      # published release you edited by hand would otherwise be overwritten when
      # publishing the draft re-creates the tag and re-triggers this workflow.
      - id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${{ steps.v.outputs.tag }}" \
               -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  # Loud, harmless job that explains why nothing was built when we skip.
  skip-notice:
    needs: version
    if: needs.version.outputs.exists == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::notice title=Release exists::A release for ${{ needs.version.outputs.tag }} already exists. Skipping build and release so any manual edits (and a published release) are preserved. To regenerate, delete that release first, then re-run."

  build:
    needs: version
    if: needs.version.outputs.exists == 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x64
            osname: linux
          - os: windows-latest
            label: windows-x64
            osname: win
          - os: macos-latest
            label: macos-arm64
            osname: mac
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      LABEL: ${{ matrix.label }}
      OSNAME: ${{ matrix.osname }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Bake the release version into the binary so `--version` and the
      # self-update check report the version this artifact was actually built
      # from, independent of whatever is committed in __init__.py.
      - name: Stamp version
        run: python scripts/stamp_version.py "${{ needs.version.outputs.version }}"

      # Split this release's notes out of [Unreleased] so the CHANGELOG.md we
      # bundle in the archive shows only this version (idempotent; local only).
      - name: Promote changelog
        run: python scripts/promote_changelog.py "${{ needs.version.outputs.version }}"

      - name: Install project and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pyinstaller

      # Optional, opt-in: bundle ffsubsync into the exe for best-quality --sync
      # (fixes framerate drift too). Off by default and best-effort, so a normal
      # tag-push release is never affected and can't be broken by it. The
      # built-in ffmpeg sync engine ships regardless.
      - name: Install ffsubsync (optional)
        if: ${{ inputs.bundle_ffsubsync == true }}
        continue-on-error: true
        run: pip install ffsubsync

      # Build the onefile binary. If ffsubsync was installed (opt-in bundling),
      # try to collect it; if that build fails for any reason, fall back to a
      # clean built-in-sync-only build so a bundling problem can never fail the
      # whole release — the built-in ffmpeg sync engine always ships.
      - name: Build standalone executable
        shell: bash
        run: |
          build() {
            pyinstaller --onefile --name subtitlegenie --clean --noconfirm "$@" run.py
          }
          EXTRA=()
          if python -c "import ffsubsync" 2>/dev/null; then
            echo "ffsubsync present — attempting to bundle it."
            # webrtcvad's PyInstaller hook (pyinstaller-hooks-contrib) is
            # currently broken and aborts the build; ffsubsync only uses
            # webrtcvad for one optional VAD backend and works without it, so
            # exclude it. If ffsubsync still can't be bundled we fall back below.
            EXTRA=(--collect-all ffsubsync --collect-all srt --exclude-module webrtcvad)
          fi
          if ! build "${EXTRA[@]}"; then
            echo "::warning title=ffsubsync not bundled::Bundling ffsubsync failed; building without it. The binary still has the built-in ffmpeg auto-sync."
            rm -rf build dist
            build
          fi

      - name: Stage and archive (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          STAGE="SubtitleGenie-${VERSION}-${LABEL}"
          BIN="SubtitleGenie_${OSNAME}_v${VERSION}"
          mkdir -p "dist/$STAGE"
          cp dist/subtitlegenie "dist/$STAGE/$BIN"
          cp README.md CHANGELOG.md "dist/$STAGE/"
          tar -C dist -czf "${STAGE}.tar.gz" "$STAGE"
          echo "ASSET=${STAGE}.tar.gz" >> "$GITHUB_ENV"

      - name: Stage and archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "SubtitleGenie-$env:VERSION-$env:LABEL"
          $bin = "SubtitleGenie_${env:OSNAME}_v${env:VERSION}.exe"
          New-Item -ItemType Directory -Force -Path "dist/$stage" | Out-Null
          Copy-Item "dist/subtitlegenie.exe" "dist/$stage/$bin"
          Copy-Item "README.md","CHANGELOG.md" "dist/$stage/"
          Compress-Archive -Path "dist/$stage/*" -DestinationPath "$stage.zip" -Force
          "ASSET=$stage.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  release:
    needs: [version, build]
    if: needs.version.outputs.exists == 'false'
    runs-on: ubuntu-latest
    steps:
      # Check out the default branch (not the tag) so the promoted CHANGELOG can
      # be committed back, clearing [Unreleased] for the next release.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Promote [Unreleased] -> [<version>] BEFORE generating notes, so the
      # notes contain only this release's changes (build_release_notes then
      # finds the exact version section instead of falling back to Unreleased).
      - name: Promote changelog
        run: python scripts/promote_changelog.py "${{ needs.version.outputs.version }}"

      - name: Build release notes
        run: python scripts/build_release_notes.py "${{ needs.version.outputs.tag }}" release_body.md

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: SubtitleGenie ${{ needs.version.outputs.version }}
          body_path: release_body.md
          draft: true
          files: artifacts/**

      # Persist the promotion so [Unreleased] is cleared for the next release.
      # Best-effort: if main is protected or the push races, the release is
      # already created with correct notes; we just warn.
      - name: Commit promoted changelog to main
        continue-on-error: true
        run: |
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "Promote changelog for ${{ needs.version.outputs.tag }} [skip ci]"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Pushed promoted changelog."; exit 0
            fi
            echo "Push failed (attempt $attempt); rebasing on latest main..."
            git pull --rebase origin main || true
          done
          echo "::warning title=Changelog not committed::Could not push the promoted CHANGELOG to main (protected branch?). The release notes are correct, but [Unreleased] wasn't cleared — promote it manually or merge a follow-up."
